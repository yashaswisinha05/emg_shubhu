[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emg-touch"
version = "0.1.0"
description = "Causal EMG/IMU state, position, screen-target, and future-motion prediction"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.1,<3",
  "scipy>=1.11,<2",
  "scikit-learn>=1.4,<2",
  "torch>=2.2,<3",
]

[tool.setuptools.packages.find]
where = ["src"]
