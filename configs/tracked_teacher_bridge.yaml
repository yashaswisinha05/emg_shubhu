seed: 42
experiment_name: "tracked_teacher_bridge"

data:
  emg_session_normalise: true
  imu_session_normalise: true
  sensors: ["S0", "S4", "S8", "S12"]
  emg_column_template: "EMG 1_{sensor}"
  acc_column_template: "ACC {axis}_{sensor}"
  gyro_column_template: "GYRO {axis}_{sensor}"
  tracker_column_prefix: "VIVE"
  tracker_id: "T0"
  sample_rate_hz: 1259.4
  decimation: 10
  emg_feature_windows_ms: [10.0, 25.0, 50.0]
  emg_feature_kinds: ["rms", "waveform_length", "log_energy", "derivative"]
  tracker_max_sync_error_ms: 20.0
  imu_posture_features: true
  posture_lowpass_ms: 400.0
  posture_baseline_ms: 300.0
  include_session_prefixes: ["dev_a1", "dev_a2", "dev_a3", "dev_a4"]
  split_by: "trial"
  validation_fraction: 0.2
  test_fraction: 0.2

model:
  grid_size: [8, 5]
  d_model: 128
  num_layers: 3
  num_heads: 4
  ffn_dim: 384
  dropout: 0.15
  patch_length: 16
  patch_stride: 8
  tcn_kernel_sizes: [3, 7, 15]
  context_ms: 2000.0
  latent_dim: 32
  teacher_layers: 2
  decoder_width: 128
  teacher_trajectory_steps: 16
  trajectory_limit_m: 0.8
  velocity_scale_mps: 1.0
  imu_modality_dropout: 0.5

  channel_time_attention:
    hidden: 32
    temperature: 0.75
    sensor_dropout_probability: 0.15
    entropy_weight: 0.0025
    smoothness_weight: 0.05
    report_lag_edges_ms: [0, 100, 250, 500, 1000, 2000]

  temporal_cross_attention:
    num_heads: 4
    dropout: 0.10
    lag_hidden: 64
    lag_edges_ms: [0, 50, 100, 200, 400, 800, 2000]

  teacher_bridge:
    hidden: 128
    dropout: 0.10
    temperature: 2.0
    advantage_temperature_px: 40.0
    minimum_teacher_weight: 0.25
    output_distillation_weight: 1.0
    emg_output_distillation_weight: 0.5
    heatmap_weight: 1.0
    offset_weight: 0.5
    direct_weight: 1.0
    # The decoder-space bridge is useful, but the full teacher latent also
    # contains privileged motion that wearables cannot reproduce exactly.
    decoder_latent_weight: 0.1

  factor_latent:
    enabled: true
    intent_dim: 16
    motion_dim: 12
    head_width: 96
    gradient_reversal_scale: 0.25

  horizon_latent:
    start: 24
    dim: 4
    bins_ms: [50, 100, 200, 300, 400]
    head_width: 64
    gradient_reversal_scale: 0.25
    target_sigma_ms: 45.0
    regression_huber_beta: 0.1
    teacher_classification_weight: 0.25
    teacher_regression_weight: 0.25
    teacher_adversarial_weight: 0.025
    student_classification_weight: 0.5
    student_regression_weight: 0.5
    student_adversarial_weight: 0.05
    emg_classification_weight: 0.25
    emg_regression_weight: 0.25
    emg_adversarial_weight: 0.025

virtual_leader:
  minimum_prefix: 16

loss:
  gaussian_sigma_cells: 0.5
  gaussian_soft_fraction: 0.15
  edge_weight: 0.5
  heatmap_weight: 1.0
  offset_weight: 0.5
  pixel_weight: 1.0
  radial_weight: 0.5
  transport_weight: 0.5
  offset_huber_beta: 0.1
  pixel_huber_beta: 0.25
  pixel_normalizer_px: 80.0
  charbonnier_epsilon_px: 1.0

distillation:
  teacher_epochs: 25
  finetune_epochs: 0
  lead_window_ms: [50.0, 400.0]
  evaluation_leads_ms: [50.0, 100.0, 200.0, 300.0, 400.0]
  selection_lead_ms: 200.0
  trajectory_epsilon_m: 0.002
  teacher_trajectory_weight: 2.0
  teacher_kl_weight: 0.0001
  teacher_kl_warmup_epochs: 5
  teacher_sigma_floor: 0.05

  student_trajectory_weight: 0.25
  # Factor coordinates remain deterministic. Teacher transfer now occurs in
  # the explicit bridge and output hierarchy instead of a Gaussian full-latent KL.
  latent_distillation_weight: 0.0
  prediction_distillation_weight: 1.0
  trajectory_distillation_weight: 0.5
  emg_only_weight: 1.0
  emg_latent_weight: 0.0
  imu_tracking_weight: 0.1
  student_noise_scale: 0.0
  decoder_finetune_lr_factor: 0.1

  teacher_factor_target_weight: 0.5
  teacher_factor_target_adversarial_weight: 0.05
  teacher_factor_motion_weight: 0.5
  teacher_factor_session_weight: 0.05
  teacher_factor_session_adversarial_weight: 0.025
  student_factor_target_weight: 0.5
  student_factor_target_adversarial_weight: 0.05
  student_factor_motion_weight: 0.25
  student_factor_session_weight: 0.05
  student_factor_session_adversarial_weight: 0.05
  emg_factor_target_weight: 2.0
  emg_factor_target_adversarial_weight: 0.1
  emg_factor_motion_weight: 0.0
  emg_factor_session_weight: 0.05
  emg_factor_session_adversarial_weight: 0.1

  adaptive_sampling:
    enabled: true
    ema_alpha: 0.5
    uniform_mix: 0.7
    power: 1.0
    max_ratio: 4.0

training:
  batch_size: 16
  num_workers: 0
  epochs: 50
  cutoffs_per_trial: 3
  learning_rate: 0.0003
  weight_decay: 0.0001
  gradient_clip_norm: 1.0
  scheduler_patience: 4
  scheduler_factor: 0.5
  minimum_learning_rate: 0.000001
  early_stopping_patience: 10
