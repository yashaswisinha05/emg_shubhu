seed: 42

paths:
  data_root: "../MERGED DATA"
  artifacts_dir: "artifacts"
  manifest: "artifacts/manifest.csv"
  cache_dir: "artifacts/cache"
  split_file: "artifacts/trajectory_cv/a1/fold-0/split.json"
  scaler: "artifacts/trajectory_cv/a1/fold-0/scaler.npz"
  output_dir: "runs/full_trajectory"

data:
  sample_rate_hz: 148.14814813792788
  median_kernel: 3
  emg_log1p: true
  target: "click"
  min_duration_s: 0.25
  max_duration_s: 10.0
  outlier_policy: "exclude"
  subject_aliases: {}
  # If yash1 and yash2 are the same physical participant, use:
  # subject_aliases:
  #   yash1: yash
  #   yash2: yash

cross_validation:
  folds: 5
  stratification_grid: [8, 5]

model:
  d_model: 128
  num_layers: 4
  num_heads: 4
  ffn_dim: 512
  dropout: 0.15
  patch_length: 16
  patch_stride: 8
  tcn_kernel_sizes: [3, 7, 15]

training:
  batch_size: 32
  bucket_size_multiplier: 10
  # Single-process loading avoids macOS torch_shm_manager restrictions.
  num_workers: 0
  epochs: 40
  learning_rate: 0.0003
  weight_decay: 0.0001
  gradient_clip_norm: 1.0
  patience: 10
  huber_beta: 0.05
  scheduler_patience: 4
  scheduler_factor: 0.5
  minimum_learning_rate: 0.000001
  amp: true
