seed: 42
experiment_name: "tracked_grid_vae_discriminator"

data:
  emg_session_normalise: true
  imu_session_normalise: true
  sensors: ["S0", "S4", "S8", "S12"]
  emg_column_template: "EMG 1_{sensor}"
  acc_column_template: "ACC {axis}_{sensor}"
  gyro_column_template: "GYRO {axis}_{sensor}"
  tracker_column_prefix: "VIVE"
  tracker_id: "T0"
  sample_rate_hz: 1259.4
  decimation: 10
  # Same causal high-rate EMG feature bank as tracked_trajectory_emg_enhanced.yaml.
  emg_feature_windows_ms: [10.0, 25.0, 50.0]
  emg_feature_kinds: ["rms", "waveform_length", "log_energy", "derivative"]
  tracker_max_sync_error_ms: 20.0
  # Gravity-referenced posture: drift-free absolute limb tilt, plus
  # inter-sensor angles that act as joint angles. Integrating acceleration
  # to locate the hand drifts ~19 cm over one reach (measured); gravity
  # direction does not drift at all. Referenced to each trial's own opening
  # rest posture, so sensor re-application between sessions cancels.
  imu_posture_features: true
  posture_lowpass_ms: 400.0
  posture_baseline_ms: 300.0
  # Within-session split. The geometry diagnostic measured the
  # tracker-to-screen frame moving between sessions: a perfect 3-D endpoint
  # scores 331 px pooled but 54.6 px within a session. A held-out-session
  # model is therefore asked for pixels in a frame it has never observed,
  # and roughly 280 px of the error it is charged with is unanswerable
  # rather than merely hard. This split asks the answerable question, and
  # matches the "within" scheme of the pretrained emg2pose reference that
  # reported 2.32 cm - which was never comparable to our held-out-session
  # numbers in the first place.
  split_by: "trial"
  validation_fraction: 0.2
  test_fraction: 0.2

# Everything below is copied from configs/hill_fusion.yaml, which is the
# config that reached 184 px on the original screen-touch dataset - not
# guessed, not re-tuned. Reusing the same operating point is deliberate: it
# isolates "does the grid+offset architecture transfer to this dataset" from
# "did these particular numbers happen to be right", which a fresh sweep
# would confound.
model:
  grid_size: [8, 5]
  d_model: 128
  num_layers: 3
  num_heads: 4
  ffn_dim: 384
  dropout: 0.15
  patch_length: 16
  patch_stride: 8
  tcn_kernel_sizes: [3, 7, 15]
  # Long masked context, matching the useful temporal coverage of the
  # pretrained emg2pose experiment without its non-causal Fourier resampling.
  context_ms: 2000.0

virtual_leader:
  # Required recorded history, independent of cutoff relative to onset.
  # Must be >= model.patch_length, since PatchTransformerEncoder needs at
  # least one full patch - enforced in the training script, not just here.
  minimum_prefix: 16

loss:
  # VAE + IMU-only critic settings, on top of the proven grid+offset loss
  # below (unchanged). See vae_discriminator.py's module docstring for the
  # mechanism.
  kl_weight: 0.0001       # small on purpose - the earlier VAE's sigma drift
                          # came from KL winning a fight against reconstruction;
                          # start weak, let coverage/KL magnitude in the
                          # printed report say whether it should move at all.
  critic_weight: 1.0      # trains critic_head to its own best from IMU alone;
                          # does not reach imu_encoder (detached in the model).
  margin_weight: 0.5
  emg_margin: 0.02        # ~15 px on a 774 px canvas - main must beat the
                          # critic by at least this much before the hinge is 0.
  gaussian_sigma_cells: 0.5
  gaussian_soft_fraction: 0.15
  edge_weight: 0.5
  heatmap_weight: 1.0
  offset_weight: 0.5
  pixel_weight: 1.0
  radial_weight: 0.5
  transport_weight: 0.5
  offset_huber_beta: 0.1
  pixel_huber_beta: 0.25
  pixel_normalizer_px: 80.0
  charbonnier_epsilon_px: 1.0

evaluation:
  # Training samples these onset-relative offsets. Validation and test visit
  # every eligible trial at every offset rather than one random cutoff. The
  # negative offsets are essential for testing anticipatory EMG before motion.
  cutoff_offsets_ms: [-300.0, -200.0, -100.0, 0.0, 100.0, 200.0, 300.0, 500.0]
  paired_interventions: true

training:
  batch_size: 16
  num_workers: 0
  epochs: 20
  learning_rate: 0.0003
  weight_decay: 0.0001
  gradient_clip_norm: 1.0
