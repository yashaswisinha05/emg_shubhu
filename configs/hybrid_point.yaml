seed: 42
experiment_name: "hybrid_point"

paths:
  data_root: "../MERGED DATA"
  artifacts_dir: "artifacts"
  manifest: "artifacts/manifest.csv"
  cache_dir: "artifacts/cache"
  split_file: "artifacts/trajectory_cv/a1/fold-0/split.json"
  scaler: "artifacts/hybrid_point/a1/fold-0/scaler.npz"
  output_dir: "runs/hybrid_point"

data:
  sample_rate_hz: 148.14814813792788
  median_kernel: 3
  emg_log1p: true
  target: "click"
  trajectory_end: "touch_time"
  temporal_anchor: "touch_time"
  imu_calibration_window_s: 0.3
  include_raw_imu: true
  min_duration_s: 0.25
  max_duration_s: 10.0
  outlier_policy: "exclude"
  subject_aliases: {}

cross_validation:
  folds: 5
  stratification_grid: [8, 5]

model:
  prediction_mode: "direct_aux_grid"
  grid_size: [8, 5]
  d_model: 128
  num_layers: 3
  num_heads: 4
  ffn_dim: 384
  dropout: 0.15
  patch_length: 16
  patch_stride: 8
  tcn_kernel_sizes: [3, 7, 15]
  imu_endpoint_s: 0.5
  emg_long_s: 0.5
  emg_short_s: 0.3

loss:
  gaussian_sigma_cells: 0.5
  gaussian_soft_fraction: 0.15
  edge_weight: 0.5
  heatmap_weight: 1.0
  offset_weight: 0.5
  pixel_weight: 1.0
  radial_weight: 0.5
  transport_weight: 0.5
  offset_huber_beta: 0.1
  pixel_huber_beta: 0.25
  pixel_normalizer_px: 80.0
  charbonnier_epsilon_px: 1.0

training:
  batch_size: 32
  bucket_size_multiplier: 10
  num_workers: 0
  epochs: 35
  learning_rate: 0.0003
  weight_decay: 0.0001
  gradient_clip_norm: 1.0
  patience: 10
  scheduler_patience: 3
  scheduler_factor: 0.5
  minimum_learning_rate: 0.000001
  amp: true
  selection_metric: "mean_pixel_error"

grid_sweep:
  epochs:
    grid_imu: 35
    grid_emg: 35
    grid_fusion: 18
  patience:
    grid_imu: 10
    grid_emg: 10
    grid_fusion: 7
