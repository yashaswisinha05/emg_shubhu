seed: 42
experiment_name: "emg_deriv"

paths:
  data_root: "../MERGED DATA"
  artifacts_dir: "artifacts"
  manifest: "artifacts/manifest.csv"
  cache_dir: "artifacts/cache"
  split_file: "artifacts/trajectory_cv/a1/fold-0/split.json"
  scaler: "artifacts/emg_deriv/a1/fold-0/scaler.npz"
  output_dir: "runs/emg_deriv"

data:
  sample_rate_hz: 148.14814813792788
  median_kernel: 3
  emg_log1p: true
  # Per-session EMG gain normalisation. Measured amplitude varies 2.1x-7.3x
  # between a1 sessions; a single pooled scale cannot remove a per-session
  # multiplicative gain. Reference is the 95th percentile of that session's
  # TRAINING trials only.
  emg_session_normalise: true
  emg_session_percentile: 95.0
  # Antagonist log-ratios and co-contraction indices (AD/LD, BB/TB). Ratios
  # are inherently gain-invariant, so they survive session differences.
  emg_derived_channels: true
  # First derivative of the session-normalised envelope as extra channels.
  # Smoothed with a causal 21-sample (~140 ms) trailing window first: the
  # envelope's ~540 ms autocorrelation makes a bare 148 Hz difference
  # noise-dominated (a1 probe: k=21 beat k=1 by ~30 px).
  emg_derivative_channels: true
  emg_derivative_window: 21
  target: "click"
  trajectory_end: "touch_time"
  temporal_anchor: "touch_time"
  imu_calibration_window_s: 0.3
  include_raw_imu: true
  min_duration_s: 0.25
  max_duration_s: 10.0
  outlier_policy: "exclude"
  subject_aliases: {}

cross_validation:
  folds: 5
  stratification_grid: [8, 5]

model:
  prediction_mode: "direct_aux_grid"
  grid_size: [8, 5]
  d_model: 128
  num_layers: 3
  num_heads: 4
  ffn_dim: 384
  dropout: 0.15
  patch_length: 16
  patch_stride: 8
  tcn_kernel_sizes: [3, 7, 15]
  # Multi-scale patching, applied COARSE: the EMG envelope autocorrelation
  # timescale on a1 is ~540 ms, five times slower than the 108 ms patch, so
  # shorter patches would resolve noise. 16/32/64 = 108/216/432 ms.
  patch_lengths: [16, 32, 64]
  # Paper finds 2 heads sufficient; 4 gave no consistent gain.
  cross_variate_heads: 2
  imu_endpoint_s: 0.5
  emg_long_s: 0.5
  emg_short_s: 0.3

channel_attention:
  enabled: true
  hidden_dim: 32
  residual_strength: 0.5

continual:
  enabled: true
  interval_s: 0.2
  random_prefixes_per_trajectory: 2
  include_start_prediction: true
  include_endpoint: true
  minimum_prefix_weight: 0.5
  start_prefix_weight: 0.35
  prefix_weight_power: 1.0
  validation_cutoffs_s: [0.0, 0.2, 0.4]
  evaluation_cutoffs_s: [0.0, 0.2, 0.4]

loss:
  gaussian_sigma_cells: 0.5
  gaussian_soft_fraction: 0.15
  edge_weight: 0.5
  heatmap_weight: 1.0
  offset_weight: 0.5
  pixel_weight: 1.0
  radial_weight: 0.5
  transport_weight: 0.5
  offset_huber_beta: 0.1
  pixel_huber_beta: 0.25
  pixel_normalizer_px: 80.0
  charbonnier_epsilon_px: 1.0

training:
  # Continual expansion creates roughly three causal views per trajectory.
  batch_size: 16
  bucket_size_multiplier: 10
  num_workers: 0
  epochs: 35
  learning_rate: 0.0003
  weight_decay: 0.0001
  gradient_clip_norm: 1.0
  patience: 10
  scheduler_patience: 3
  scheduler_factor: 0.5
  minimum_learning_rate: 0.000001
  amp: true
  selection_metric: "weighted_mean_pixel_error"

grid_sweep:
  epochs:
    grid_imu: 35
    grid_emg: 35
    grid_fusion: 18
    grid_crossvar: 35
    grid_emg: 35
    grid_fusion: 18
  patience:
    grid_imu: 10
    grid_emg: 10
    grid_fusion: 7
    grid_crossvar: 10
    grid_emg: 10
    grid_fusion: 7
