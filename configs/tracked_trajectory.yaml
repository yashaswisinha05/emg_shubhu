seed: 42
experiment_name: "tracked_trajectory"

data:
  # Normalise EMG per session by that session's own 95th-percentile
  # amplitude. Without it the encoder sees a different amplitude range in
  # every session, which is the most likely reason EMG measured as harmful
  # under held-out-session evaluation.
  emg_session_normalise: true
  # Read off the real export by scripts/inspect_tracked_dataset.py, not
  # assumed - the tracked rig records RAW EMG ("EMG 1_S0"), not the RMS
  # envelope ("EMG RMS 1_S0") the original project used.
  sensors: ["S0", "S4", "S8", "S12"]
  emg_column_template: "EMG 1_{sensor}"
  acc_column_template: "ACC {axis}_{sensor}"
  gyro_column_template: "GYRO {axis}_{sensor}"
  tracker_column_prefix: "VIVE"
  tracker_id: "T0"

  # Measured at 1259.4 Hz on every one of the 15 sessions (min = max),
  # against a declared 1259.26 - agreement to 0.01%.
  sample_rate_hz: 1259.4
  # -> ~126 Hz. Deliberately below the Vive's true ~250 Hz lighthouse rate:
  # the export carries a distinct pose on every row at 1259 Hz, so something
  # upsamples onto the EMG clock, and sampling below the true rate means we
  # read the underlying trajectory rather than whatever the interpolant
  # invented. Differentiating at the row rate would amplify it instead.
  decimation: 10
  # Causal rectify-and-average window for the raw bipolar EMG (52% of
  # samples measured negative).
  emg_envelope_ms: 40.0
  # sync_error_ms median ~3 ms with a tail to 89 ms. Measured: 0.70% of
  # samples over 10 ms, 0.13% over 20, 0.05% over 40. A 20 ms cut discards
  # roughly one sample in 800, and keeps misalignment well inside the
  # 40-80 ms electromechanical delay that makes EMG predictive.
  # tracking_age_us is deliberately unused: it reads exactly zero in every
  # trial across all 15 sessions, so it is a stub, not a clean tracker.
  tracker_max_sync_error_ms: 20.0

  # Hold out whole sessions. Splitting trials within a session shares that
  # session's electrode placement and skin condition across train and test,
  # which flatters the result; session-level asks whether the model
  # transfers to an unseen participant, which is the question for a wearable.
  split_by: "session"
  validation_fraction: 0.2
  test_fraction: 0.2

model:
  d_model: 128

virtual_leader:
  # 32 steps at ~126 Hz is ~0.25 s of prediction.
  horizon: 32
  minimum_prefix: 16
  position_dim: 3
  substeps: 4
  # Largest destination displacement the attractor prior may propose.
  # Bounded because eta is learned and shared with the rollout - see
  # trajectory_intent_vae.py for the KL runaway this prevents.
  prior_displacement_limit_m: 0.8
  # Latent partition for --model anticipatory.
  kinematic_dim: 16
  anticipatory_dim: 16
  residual_dim: 8
  # Drop z_ant this often during training so that silencing it at evaluation
  # is in-distribution - otherwise the reported anticipatory gain measures
  # the decoder's surprise rather than the subspace's information.
  anticipatory_dropout: 0.1
  # MUST match data.decimation. The rollout computes its timestep as
  # virtual_leader.decimation / data.sample_rate_hz, and the dataset has
  # already decimated by data.decimation, so leaving this at 1 makes the
  # model integrate with a dt ten times too small - it covers 0.025 s while
  # being scored against 0.25 s of real motion, and cannot reach anywhere.
  # The baselines use the effective rate, so only the model was handicapped.
  decimation: 10

loss:
  # Weight on the adversarial session term (read from loss.*, which is where
  # anticipatory_losses looks). If EMG hurts because it is session-specific,
  # this is the intervention that could recover it: a discriminator that
  # cannot read participant identity out of the latent is a representation
  # whose EMG content transfers across people.
  session_adversarial_weight: 0.2
  kl_weight: 0.01
  trajectory_epsilon_m: 0.002
  # How tightly the KL pulls the posterior toward the attractor readout.
  # 0.05 m was far too confident: KL scales as 1/sigma^2, so it multiplied
  # the squared destination error by 400 and dominated the objective. A
  # reach is 30-50 cm, so claiming the instantaneous readout pins the
  # destination to 5 cm is not a defensible prior.
  trajectory_prior_sigma: 0.15

training:
  batch_size: 16
  num_workers: 0
  epochs: 20
  learning_rate: 0.0003
  weight_decay: 0.0001
  gradient_clip_norm: 1.0
