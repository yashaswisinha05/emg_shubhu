seed: 42
experiment_name: "hill_fusion"

paths:
  data_root: "../MERGED DATA"
  artifacts_dir: "artifacts"
  manifest: "artifacts/manifest.csv"
  cache_dir: "artifacts/cache"
  split_file: "artifacts/trajectory_cv/a1/fold-0/split.json"
  scaler: "artifacts/hill_fusion/a1/fold-0/scaler.npz"
  output_dir: "runs/hill_fusion"

data:
  sample_rate_hz: 148.14814813792788
  median_kernel: 3
  emg_log1p: true
  target: "click"
  trajectory_end: "touch_time"
  temporal_anchor: "touch_time"
  imu_calibration_window_s: 0.3
  include_raw_imu: true
  min_duration_s: 0.25
  max_duration_s: 10.0
  outlier_policy: "exclude"
  subject_aliases: {}

cross_validation:
  folds: 5
  stratification_grid: [8, 5]

model:
  prediction_mode: "direct_aux_grid"
  # VAE-style: grid_fusion's EMG residual head grows a second output (sigma)
  # off the same trunk that already produces mu, trained by loss.nll_weight
  # below. mu/pixel accuracy is completely unaffected - sigma is trained
  # only by the NLL, never fed back into mu's own training. Test with
  # --kind grid_fusion first (not a physics variant): the physics wrapper
  # overwrites direct_prediction with its own blended output, so sigma
  # would end up describing uncertainty around the blend, not around the
  # plain fused mu this was designed to calibrate against.
  predict_uncertainty: true
  grid_size: [8, 5]
  d_model: 128
  num_layers: 3
  num_heads: 4
  ffn_dim: 384
  dropout: 0.15
  patch_length: 16
  patch_stride: 8
  tcn_kernel_sizes: [3, 7, 15]
  imu_endpoint_s: 0.5
  emg_long_s: 0.5
  emg_short_s: 0.3

channel_attention:
  enabled: true
  hidden_dim: 32
  residual_strength: 0.5

continual:
  enabled: true
  interval_s: 0.2
  random_prefixes_per_trajectory: 2
  include_start_prediction: true
  include_endpoint: true
  minimum_prefix_weight: 0.5
  start_prefix_weight: 0.35
  prefix_weight_power: 1.0
  validation_cutoffs_s: [0.0, 0.2, 0.4]
  evaluation_cutoffs_s: [0.0, 0.2, 0.4]

loss:
  gaussian_sigma_cells: 0.5
  gaussian_soft_fraction: 0.15
  edge_weight: 0.5
  heatmap_weight: 1.0
  offset_weight: 0.5
  pixel_weight: 1.0
  radial_weight: 0.5
  transport_weight: 0.5
  offset_huber_beta: 0.1
  pixel_huber_beta: 0.25
  pixel_normalizer_px: 80.0
  charbonnier_epsilon_px: 1.0
  # Supervise the physics rollout's own endpoint against the same click.
  # Raised 10x from 0.1: at 0.1, physics_loss (~7-10 unweighted, from a real
  # 15-epoch run) contributed only ~5-6% of total loss, and physics_blend
  # stayed pinned at its ~0.018 init the whole run - not enough pressure to
  # make physics_prediction accurate enough to be worth leaning on. This is
  # a deliberate stress test of whether the branch is capable of an accurate
  # endpoint at all, not a claim that 1.0 is the right operating point.
  physics_weight: 1.0
  # Charge for residual torque so the Hill terms explain the motion rather
  # than the residual quietly absorbing all of it.
  physics_residual_weight: 0.01
  # Charges imbalance between the endpoint-to-screen affine's three input
  # columns (physics3 only) - coefficient of variation of ||W[:,0]||,
  # ||W[:,1]||, ||W[:,2]||, not raw magnitude. A free 3->2 affine can fit the
  # target using only the well-measured, high-variance shoulder axes,
  # leaving the elbow no gradient pressure even when its trajectory is
  # wrong - confirmed on a real checkpoint via diagnose_arm3_reach.py's bias
  # sweep. A first attempt at this penalised raw ||W||^2 at weight 0.05 and
  # measurably did nothing (elbow travel 0.033 -> 0.040 rad, same
  # bias-sweep verdict) - a uniform-magnitude penalty doesn't create
  # pressure to use one column *more* than another, only to shrink all of
  # them together. This version was measured directly instead of guessed:
  # the penalty sits around 0.6-1.3 against physics_loss's ~7 at
  # physics_weight=1.0, and confirmed to push gradient preferentially into
  # an artificially collapsed column (7.8 vs 6.5 for the others) before
  # this weight was chosen. 1.0 is still a starting point to tune, not a
  # final value - watch affine_penalty and elbow travel (section [1] of
  # diagnose_arm3_reach.py) together after changing it.
  affine_weight_penalty: 1.0
  # Weight on the Gaussian NLL that trains direct_sigma (model.
  # predict_uncertainty above). 1.0 is a genuine unit-weighted NLL, not a
  # guess to recalibrate later like the two weights above - the loss is
  # already in the right units (log-likelihood of the target under
  # N(mu, sigma^2), same normalised-screen scale mu itself is trained in),
  # so there's no magnitude mismatch to correct for the way there was with
  # affine_weight_penalty.
  nll_weight: 1.0
  # KL(q(z|x) || N(0,I)) weight for grid_fusion_vae - the strength of the
  # information bottleneck, since every bit the latent carries is paid for
  # here. Small to start deliberately: the prior question is whether a
  # 3-dimensional latent can carry the prediction at all, and a large weight
  # would confound "bottleneck too tight" with "penalty too strong". Watch
  # the kl= value printed each epoch - near 0 means the latent collapsed to
  # the prior and carries nothing, and accuracy should then be no better
  # than predicting a constant.
  kl_weight: 0.01
  # Weight on the per-timestep virtual-leader destination loss
  # (grid_fusion_vl). Set to 1.0 so it sits at the same scale as the
  # endpoint pixel losses it complements rather than competes with - both
  # are charbonnier distances in the same pixel_normalizer_px units, so
  # there is no magnitude mismatch to correct for here.
  vl_weight: 1.0

physics:
  # Prescribe the two shoulder joints from measured IMU orientation and
  # integrate only the elbow. All four sensors sit proximal to the elbow, so
  # the shoulder is observed and the elbow is not; BB/TB EMG is the only
  # signal that carries elbow flexion. Set false to ablate back to
  # free-integrating all three joints from a context guess.
  imu_driven_shoulder: true
  # Give the rollout the gravity torque it already knows so the learned term
  # only explains voluntary drive (tau = known + learned).
  gravity_compensation: true
  # Bound on the learned elbow torque. Measured against this arm's forearm
  # inertia and joint damping: 1 N*m sweeps the elbow across essentially its
  # whole range over a typical trial, while 3 N*m drove it into a joint stop
  # at every setting tested, leaving no usable gradient.
  torque_scale: 1.0
  # Integrate every 4th sample (~37 Hz). Arm dynamics are far slower than the
  # 148 Hz sampling rate, and this keeps the differentiable rollout cheap.
  decimation: 4
  residual_torque_scale: 5.0
  # sigmoid(-4) ~ 0.018: the model starts as essentially grid_fusion and the
  # physics branch has to earn any influence on the reported coordinate.
  blend_init: -4.0

training:
  # Continual expansion creates roughly three causal views per trajectory.
  batch_size: 16
  bucket_size_multiplier: 10
  num_workers: 0
  epochs: 35
  learning_rate: 0.0003
  weight_decay: 0.0001
  gradient_clip_norm: 1.0
  patience: 10
  scheduler_patience: 3
  scheduler_factor: 0.5
  minimum_learning_rate: 0.000001
  amp: true
  selection_metric: "weighted_mean_pixel_error"

grid_sweep:
  epochs:
    grid_imu: 35
    grid_emg: 35
    grid_fusion: 18
    grid_fusion_physics: 18
  patience:
    grid_imu: 10
    grid_emg: 10
    grid_fusion: 7
    grid_fusion_physics: 7
