<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="690" viewBox="0 0 1900 690" role="img" aria-labelledby="title desc">
  <title id="title">Causal shared-encoder neuromuscular intent model</title>
  <desc id="desc">A compact left-to-right scientific model diagram with straight arrows.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#334155"/>
    </marker>
    <style>
      .column{font:700 17px Arial,sans-serif;fill:#5B616B}
      .verb{font:700 20px Arial,sans-serif;fill:#111827}
      .input{font:700 19px Arial,sans-serif}
      .tensor{font:italic 14px Arial,sans-serif;fill:#475569}
      .output{font:700 17px Arial,sans-serif;fill:#111827}
      .loss{font:700 13px Arial,sans-serif;fill:#D97706}
      .note{font:13px Arial,sans-serif;fill:#64748B}
      .box{stroke-width:2;rx:10;ry:10}
      .arrow{fill:none;stroke:#334155;stroke-width:2.2;marker-end:url(#arrow)}
      .frozen{stroke-dasharray:7 5}
    </style>
  </defs>

  <rect width="1900" height="690" fill="#FFFFFF"/>

  <!-- column headings -->
  <text x="95" y="48" text-anchor="middle" class="column">Input</text>
  <text x="265" y="48" text-anchor="middle" class="column">Preprocess</text>
  <text x="475" y="48" text-anchor="middle" class="column">Shared Encoding</text>
  <text x="700" y="48" text-anchor="middle" class="column">Adaptation</text>
  <text x="930" y="48" text-anchor="middle" class="column">Conditioning</text>
  <text x="1170" y="48" text-anchor="middle" class="column">Fusion</text>
  <text x="1430" y="48" text-anchor="middle" class="column">Projection</text>
  <text x="1745" y="48" text-anchor="middle" class="column">Output</text>

  <!-- inputs -->
  <rect x="28" y="120" width="135" height="76" class="box" fill="#E7F2FF" stroke="#087DBD"/>
  <text x="95" y="153" text-anchor="middle" class="input" fill="#087DBD">sEMG</text>
  <text x="95" y="177" text-anchor="middle" class="tensor">4 ch</text>
  <rect x="28" y="450" width="135" height="76" class="box" fill="#FFF3E4" stroke="#D97706"/>
  <text x="95" y="483" text-anchor="middle" class="input" fill="#D97706">IMU</text>
  <text x="95" y="507" text-anchor="middle" class="tensor">24 ch</text>

  <!-- one verb per action box -->
  <rect x="205" y="120" width="120" height="76" class="box" fill="#EDF5FF" stroke="#087DBD"/>
  <text x="265" y="166" text-anchor="middle" class="verb">Filter</text>
  <rect x="205" y="450" width="120" height="76" class="box" fill="#FFF7EA" stroke="#D97706"/>
  <text x="265" y="496" text-anchor="middle" class="verb">Filter</text>

  <rect x="405" y="120" width="140" height="76" class="box frozen" fill="#EDF5FF" stroke="#2563EB"/>
  <text x="475" y="166" text-anchor="middle" class="verb">Encode</text>
  <rect x="405" y="450" width="140" height="76" class="box frozen" fill="#FFF7EA" stroke="#D97706"/>
  <text x="475" y="496" text-anchor="middle" class="verb">Encode</text>

  <rect x="635" y="120" width="130" height="76" class="box" fill="#EDF5FF" stroke="#2563EB"/>
  <text x="700" y="166" text-anchor="middle" class="verb">Adapt</text>
  <rect x="635" y="450" width="130" height="76" class="box" fill="#FFF7EA" stroke="#D97706"/>
  <text x="700" y="496" text-anchor="middle" class="verb">Adapt</text>

  <rect x="630" y="284" width="140" height="76" class="box frozen" fill="#F2ECFF" stroke="#7C3AED"/>
  <text x="700" y="330" text-anchor="middle" class="verb">Classify</text>

  <rect x="855" y="120" width="150" height="76" class="box" fill="#EAF8F3" stroke="#0F8B6D"/>
  <text x="930" y="166" text-anchor="middle" class="verb">Condition</text>

  <rect x="1095" y="284" width="150" height="76" class="box" fill="#EAF8F3" stroke="#0F8B6D"/>
  <text x="1170" y="330" text-anchor="middle" class="verb">Fuse</text>

  <rect x="1360" y="284" width="140" height="76" class="box" fill="#F8FAFC" stroke="#475569"/>
  <text x="1430" y="330" text-anchor="middle" class="verb">Project</text>

  <!-- straight arrows with compact payload labels -->
  <line x1="163" y1="158" x2="205" y2="158" class="arrow"/><text x="184" y="146" text-anchor="middle" class="tensor">e<tspan baseline-shift="sub">t</tspan></text>
  <line x1="163" y1="488" x2="205" y2="488" class="arrow"/><text x="184" y="476" text-anchor="middle" class="tensor">i<tspan baseline-shift="sub">t</tspan></text>
  <line x1="325" y1="158" x2="405" y2="158" class="arrow"/><text x="365" y="146" text-anchor="middle" class="tensor">x<tspan baseline-shift="sub">e</tspan></text>
  <line x1="325" y1="488" x2="405" y2="488" class="arrow"/><text x="365" y="476" text-anchor="middle" class="tensor">x<tspan baseline-shift="sub">i</tspan></text>
  <line x1="545" y1="158" x2="635" y2="158" class="arrow"/><text x="590" y="146" text-anchor="middle" class="tensor">z<tspan baseline-shift="sub">e</tspan></text>
  <line x1="545" y1="488" x2="635" y2="488" class="arrow"/><text x="590" y="476" text-anchor="middle" class="tensor">z<tspan baseline-shift="sub">i</tspan></text>
  <polyline points="545,184 580,184 580,306 630,306" class="arrow"/><text x="566" y="210" text-anchor="middle" class="tensor">z<tspan baseline-shift="sub">e</tspan></text>
  <polyline points="545,462 580,462 580,338 630,338" class="arrow"/><text x="566" y="450" text-anchor="middle" class="tensor">z<tspan baseline-shift="sub">i</tspan></text>
  <line x1="765" y1="158" x2="855" y2="158" class="arrow"/><text x="810" y="146" text-anchor="middle" class="tensor">h<tspan baseline-shift="sub">e</tspan></text>
  <polyline points="770,306 800,306 800,182 855,182" class="arrow"/><text x="812" y="205" text-anchor="middle" class="tensor">p<tspan baseline-shift="sub">g</tspan></text>
  <polyline points="1005,182 1040,182 1040,302 1095,302" class="arrow"/><text x="1066" y="290" text-anchor="middle" class="tensor">c<tspan baseline-shift="sub">t</tspan>, γ<tspan baseline-shift="sub">t</tspan></text>
  <polyline points="765,488 1035,488 1035,342 1095,342" class="arrow"/><text x="930" y="476" text-anchor="middle" class="tensor">h<tspan baseline-shift="sub">i</tspan></text>
  <line x1="1245" y1="322" x2="1360" y2="322" class="arrow"/><text x="1302" y="310" text-anchor="middle" class="tensor">f<tspan baseline-shift="sub">t</tspan></text>

  <!-- integrated output and training objectives -->
  <rect x="1600" y="78" width="260" height="105" class="box" fill="#E7F2FF" stroke="#2563EB"/>
  <text x="1730" y="111" text-anchor="middle" class="output">Gripper State</text>
  <text x="1730" y="138" text-anchor="middle" class="tensor">open / close</text>
  <text x="1730" y="164" text-anchor="middle" class="loss">CE</text>

  <rect x="1600" y="211" width="260" height="105" class="box" fill="#E7F2FF" stroke="#2563EB"/>
  <text x="1730" y="244" text-anchor="middle" class="output">Current</text>
  <text x="1730" y="271" text-anchor="middle" class="tensor">XYZ<tspan baseline-shift="sub">t</tspan> · Pixel<tspan baseline-shift="sub">t</tspan></text>
  <text x="1730" y="297" text-anchor="middle" class="loss">L<tspan baseline-shift="sub">pos</tspan> + L<tspan baseline-shift="sub">px</tspan></text>

  <rect x="1600" y="344" width="260" height="105" class="box" fill="#EAF8F3" stroke="#0F8B6D"/>
  <text x="1730" y="377" text-anchor="middle" class="output">Motion</text>
  <text x="1730" y="404" text-anchor="middle" class="tensor">XYZ<tspan baseline-shift="sub">t+10:200 ms</tspan></text>
  <text x="1730" y="430" text-anchor="middle" class="loss">L<tspan baseline-shift="sub">future</tspan></text>

  <rect x="1600" y="477" width="260" height="105" class="box" fill="#F2ECFF" stroke="#7C3AED"/>
  <text x="1730" y="510" text-anchor="middle" class="output">Intent</text>
  <text x="1730" y="537" text-anchor="middle" class="tensor">XYZ<tspan baseline-shift="sub">t+0.1:1.0 s</tspan></text>
  <text x="1730" y="563" text-anchor="middle" class="loss">L<tspan baseline-shift="sub">intent</tspan> + L<tspan baseline-shift="sub">EMG→IMU</tspan></text>

  <polyline points="770,322 790,322 790,92 1570,92 1570,130 1600,130" class="arrow"/><text x="1180" y="81" text-anchor="middle" class="tensor">p<tspan baseline-shift="sub">g</tspan></text>
  <polyline points="1500,304 1540,304 1540,263 1600,263" class="arrow"/><text x="1568" y="251" text-anchor="middle" class="tensor">ŷ<tspan baseline-shift="sub">t</tspan></text>
  <polyline points="1500,322 1560,322 1560,397 1600,397" class="arrow"/><text x="1578" y="385" text-anchor="middle" class="tensor">ŷ<tspan baseline-shift="sub">short</tspan></text>
  <polyline points="1500,340 1580,340 1580,529 1600,529" class="arrow"/><text x="1582" y="517" text-anchor="end" class="tensor">ŷ<tspan baseline-shift="sub">long</tspan></text>

  <text x="475" y="558" text-anchor="middle" class="note">dashed border = frozen</text>
  <text x="1730" y="624" text-anchor="middle" class="note">orange terms apply during training</text>
</svg>
